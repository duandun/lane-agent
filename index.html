<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Web</title>
    <script>
      // 在样式加载前定好主题，避免先闪一下暗色。
      try {
        var saved = localStorage.getItem("opencode-web.theme")
        var mode = saved === "light" || saved === "dark" ? saved : "auto"
        var dark =
          mode === "dark" ||
          (mode === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.dataset.theme = dark ? "dark" : "light"
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Live2D 依赖以全局脚本加载：PixiJS 6 与打包器的兼容性不稳定。 -->
    <script src="/live2d/lib/pixi.min.js"></script>
    <script src="/live2d/lib/live2dcubismcore.min.js"></script>
    <script src="/live2d/lib/cubism4.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
